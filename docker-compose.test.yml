services:
  postgres:
    image: postgres:17-alpine
    container_name: stdev-test-postgres
    environment:
      POSTGRES_USER: stdev
      POSTGRES_PASSWORD: stdev
      POSTGRES_DB: stdev_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stdev -d stdev_test']
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  # MinIO acts as a local S3-compatible endpoint for Playwright E2E tests so
  # `@aws-sdk/client-s3` calls from the Next.js server never touch real AWS.
  # The entrypoint is overridden to pre-create the `stdev-kr` bucket as a
  # top-level directory (MinIO single-drive mode treats those as buckets)
  # before execing the server, so no extra init sidecar is needed.
  #
  # The image is Silo (github.com/pgsty/silo), the community-maintained MinIO
  # fork, not MinIO's own: docker.io/minio/minio is gone and quay.io/minio/minio
  # now rejects every anonymous pull, pinned tags and digests included
  # ("unauthorized: access to the requested resource is not authorized"). Silo
  # keeps the MINIO_* variables, the /minio/health/* routes and curl; only the
  # binary is named `silo`. Pinned by tag and digest so the server cannot change
  # under CI unnoticed. A machine with the old MinIO image cached keeps working,
  # which is why this only broke in CI.
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    container_name: stdev-test-minio
    environment:
      MINIO_ROOT_USER: test-access-key
      MINIO_ROOT_PASSWORD: test-secret-key
    ports:
      - '9000:9000'
      - '9001:9001'
    entrypoint: sh
    command: -c 'mkdir -p /data/stdev-kr && exec silo server /data --console-address ":9001"'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 3s
    tmpfs:
      - /data
