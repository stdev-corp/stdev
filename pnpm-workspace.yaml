# `tools/*` holds build-time-only helper packages. `tools/migrate` exists so
# `pnpm deploy` can materialise a minimal, lockfile-derived Prisma CLI tree for
# the Docker runner stage; see Dockerfile.
packages:
  - tools/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
